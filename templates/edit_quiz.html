{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">Edit Quiz Parameters</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Quiz Title</label>
            <input class="form-control" type="text" name="title" value="{{ quiz.title }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Quiz Date</label>
            <input class="form-control" type="date" name="quiz_date" value="{{ quiz.quiz_date }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Quiz Timer (minutes)</label>
            <input class="form-control" type="number" name="duration_minutes" min="1" max="180" value="{{ quiz.duration_minutes }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Per Question Timer (seconds)</label>
            <input class="form-control" type="number" name="question_duration_seconds" min="5" max="300" value="{{ quiz.question_duration_seconds }}" required>
          </div>
          <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" name="enabled" id="enabled" {% if quiz.enabled == 1 %}checked{% endif %}>
            <label class="form-check-label" for="enabled">Enable for students</label>
          </div>
          <button class="btn btn-success" type="submit">Save Changes</button>
          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Back</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
