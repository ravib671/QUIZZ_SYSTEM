{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Student Account Creation</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">USN (Username)</label>
            <input type="text" name="usn" class="form-control" placeholder="e.g. 1RV23CS001" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
            <div class="form-text">At least 8 chars with uppercase, lowercase, digit, and special character.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>
        <hr>
        <p class="mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
