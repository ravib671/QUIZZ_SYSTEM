{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h3 class="mb-0">{{ quiz.title }}</h3>
    <div class="text-muted">Question <span id="currentQuestionNo">1</span> of {{ questions|length }}</div>
  </div>
  <div class="alert alert-warning py-2 px-3 mb-0">
    Question Time Left: <strong id="questionTimer">--</strong>s
  </div>
</div>
<form method="post" class="card" id="quizForm">
  <div class="card-body">
    {% for q in questions %}
      <input type="hidden" name="question_{{ q.id }}" id="answer_{{ q.id }}">
      <div class="question-panel {% if not loop.first %}d-none{% endif %}" data-question-id="{{ q.id }}" data-question-index="{{ loop.index0 }}">
        <p><strong>Q{{ loop.index }}.</strong> {{ q.question }}</p>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="choice_{{ q.id }}" value="A" id="q{{ q.id }}a">
          <label class="form-check-label" for="q{{ q.id }}a">A. {{ q.option_a }}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="choice_{{ q.id }}" value="B" id="q{{ q.id }}b">
          <label class="form-check-label" for="q{{ q.id }}b">B. {{ q.option_b }}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="choice_{{ q.id }}" value="C" id="q{{ q.id }}c">
          <label class="form-check-label" for="q{{ q.id }}c">C. {{ q.option_c }}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="choice_{{ q.id }}" value="D" id="q{{ q.id }}d">
          <label class="form-check-label" for="q{{ q.id }}d">D. {{ q.option_d }}</label>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-success submit-question" type="button">Submit Answer</button>
          <button class="btn btn-outline-secondary skip-question" type="button">Skip</button>
        </div>
      </div>
    {% endfor %}
    <div id="completionMessage" class="alert alert-info d-none mb-0">
      All questions are completed. Submitting quiz...
    </div>
  </div>
</form>
<script>
  (function () {
    const formEl = document.getElementById("quizForm");
    const timerEl = document.getElementById("questionTimer");
    const currentQuestionNoEl = document.getElementById("currentQuestionNo");
    const completionMessage = document.getElementById("completionMessage");
    const panels = Array.from(document.querySelectorAll(".question-panel"));
    const questionDurationSeconds = {{ question_duration_seconds }};
    let currentIndex = 0;
    let remaining = questionDurationSeconds;
    let intervalId = null;
    let submitted = false;

    function showQuestion(index) {
      panels.forEach((panel, idx) => panel.classList.toggle("d-none", idx !== index));
      currentQuestionNoEl.textContent = String(index + 1);
      remaining = questionDurationSeconds;
      timerEl.textContent = String(remaining);
      if (intervalId) {
        clearInterval(intervalId);
      }
      intervalId = setInterval(tick, 1000);
    }

    function finishQuestion(saveAnswer) {
      if (submitted || currentIndex >= panels.length) return;
      const panel = panels[currentIndex];
      const questionId = panel.dataset.questionId;
      const checked = panel.querySelector(`input[name="choice_${questionId}"]:checked`);
      document.getElementById(`answer_${questionId}`).value = saveAnswer && checked ? checked.value : "";
      currentIndex += 1;
      if (currentIndex >= panels.length) {
        submitted = true;
        if (intervalId) clearInterval(intervalId);
        panels.forEach((p) => p.classList.add("d-none"));
        completionMessage.classList.remove("d-none");
        formEl.submit();
        return;
      }
      showQuestion(currentIndex);
    }

    function tick() {
      remaining -= 1;
      timerEl.textContent = String(Math.max(0, remaining));
      if (remaining <= 0) {
        finishQuestion(false);
      }
    }

    document.querySelectorAll(".submit-question").forEach((btn) => {
      btn.addEventListener("click", () => finishQuestion(true));
    });
    document.querySelectorAll(".skip-question").forEach((btn) => {
      btn.addEventListener("click", () => finishQuestion(false));
    });

    if (panels.length > 0) {
      showQuestion(0);
    }
  })();
</script>
{% endblock %}
