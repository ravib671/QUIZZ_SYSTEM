{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">{{ quiz.title }}</h3>
  <div class="alert alert-warning py-2 px-3 mb-0">
    Time Left: <strong id="timer">--:--</strong>
  </div>
</div>
<form method="post" class="card" id="quizForm">
  <div class="card-body">
    {% for q in questions %}
      <div class="mb-4">
        <p><strong>Q{{ loop.index }}.</strong> {{ q.question }}</p>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="A" required>
          <label class="form-check-label">A. {{ q.option_a }}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="B">
          <label class="form-check-label">B. {{ q.option_b }}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="C">
          <label class="form-check-label">C. {{ q.option_c }}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="D">
          <label class="form-check-label">D. {{ q.option_d }}</label>
        </div>
      </div>
      <hr>
    {% endfor %}
    <button class="btn btn-success" type="submit">Submit Quiz</button>
    <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
<script>
  (function () {
    const timerEl = document.getElementById("timer");
    const formEl = document.getElementById("quizForm");
    const durationSeconds = {{ duration_seconds }};
    const startTime = {{ start_time }};
    const serverNow = {{ server_now }};
    const clientNow = Math.floor(Date.now() / 1000);
    const serverClientOffset = serverNow - clientNow;
    const endEpoch = startTime + durationSeconds;

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function tick() {
      const nowEpoch = Math.floor(Date.now() / 1000) + serverClientOffset;
      const remaining = endEpoch - nowEpoch;
      timerEl.textContent = formatTime(remaining);
      if (remaining <= 0) {
        formEl.submit();
      }
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>
{% endblock %}
