{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Student Account Creation</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">USN (Username)</label>
            <input type="text" name="usn" class="form-control text-uppercase" placeholder="e.g. 1RV23CS001" required oninput="this.value = this.value.toUpperCase()">
            <div class="form-text">USN will be stored in uppercase only.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Semester</label>
              <input type="number" name="sem" class="form-control" min="1" max="8" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Section</label>
              <select name="section" id="section" class="form-select" required onchange="syncBatchOptions()">
                <option value="">Select</option>
                {% for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' %}
                <option value="{{ ch }}">{{ ch }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Batch</label>
              <select name="batch" id="batch" class="form-select" required>
                <option value="">Select section first</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
            <div class="form-text">At least 8 chars with uppercase, lowercase, digit, and special character.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>
        <hr>
        <p class="mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>
<script>
function syncBatchOptions() {
  const section = document.getElementById("section").value;
  const batch = document.getElementById("batch");
  batch.innerHTML = "";
  if (!section) {
    batch.innerHTML = '<option value="">Select section first</option>';
    return;
  }
  batch.innerHTML = '<option value="">Select</option>';
  [1, 2, 3].forEach((idx) => {
    const opt = document.createElement("option");
    opt.value = `${section}${idx}`;
    opt.textContent = `${section}${idx}`;
    batch.appendChild(opt);
  });
}
</script>
{% endblock %}
